<!DOCTYPE html>
<html lang="en">
<head>

    <title>Mantuyong OneServe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chat-card">
    <header>
        <div class="header-content">
            <div class="logo-circle">
                <img src="c:\Users\breat\OneDrive\Documents\Barangay_RAG\logo.jpg" alt="Logo" id="brgy-logo">
            </div>
            <div class="header-text">
                <h1>Mantuyong OneServe</h1>
                <p>Virtual Assistant of Barangay Mantuyong</p>
            </div>
        </div>
    </header>
    <div id="chat-window">

    </div>
